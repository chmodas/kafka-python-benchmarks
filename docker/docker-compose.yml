# Single-broker Kafka in KRaft mode for benchmarks.
#
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-bench
    hostname: kafka
    cap_add:
      - NET_ADMIN  # allow `tc qdisc` inside the container for netem mode
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_MS: "60000"          # 1 minute – short so segments roll out fast
      KAFKA_LOG_SEGMENT_BYTES: "10485760"      # 10 MB – small segments so deletion happens promptly
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: "10000"
      KAFKA_OFFSETS_RETENTION_MINUTES: "5"     # expire orphan consumer-group offsets quickly
      KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS: "1000"
      KAFKA_NUM_NETWORK_THREADS: "8"
      KAFKA_NUM_IO_THREADS: "8"
      KAFKA_SOCKET_SEND_BUFFER_BYTES: "1048576"
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: "1048576"
      KAFKA_HEAP_OPTS: "-Xmx2G -Xms2G"         # default 1G is not enough for a long sweep
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"    # ensure logs go to the writable tmpfs below
      CLUSTER_ID: "bench-cluster-0000000000A"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    tmpfs:
      # mode=1777 (world-writable + sticky) is needed because Docker mounts
      # tmpfs as root-owned by default and Kafka runs as appuser.
      - /var/lib/kafka/data:size=8g,mode=1777
