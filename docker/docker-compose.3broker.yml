# 3-broker Kafka in KRaft mode for runs where acks=all should be meaningful.

services:
  kafka1:
    image: apache/kafka:3.9.0
    container_name: kafka-bench-1
    hostname: kafka1
    cap_add:
      - NET_ADMIN
    ports:
      - "9092:9092"
    environment: &kafka-base
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:9093,2@kafka2:9093,3@kafka3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_RETENTION_HOURS: "1"
      CLUSTER_ID: "bench-cluster-0000000000A"
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
    tmpfs:
      - /var/lib/kafka/data:size=2g

  kafka2:
    image: apache/kafka:3.9.0
    container_name: kafka-bench-2
    hostname: kafka2
    cap_add:
      - NET_ADMIN
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-base
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: "PLAINTEXT://:9094,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9094"
    tmpfs:
      - /var/lib/kafka/data:size=2g

  kafka3:
    image: apache/kafka:3.9.0
    container_name: kafka-bench-3
    hostname: kafka3
    cap_add:
      - NET_ADMIN
    ports:
      - "9096:9096"
    environment:
      <<: *kafka-base
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: "PLAINTEXT://:9096,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9096"
    tmpfs:
      - /var/lib/kafka/data:size=2g
