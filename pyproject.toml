[project]
name = "kafka-python-benchmarks"
version = "0.1.0"
description = "Latency-focused benchmarks comparing kafka-python, confluent-kafka, and aiokafka"
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "kafka-python==2.3.1",
    "confluent-kafka==2.14.0",
    "aiokafka==0.14.0",
    "hdrhistogram==0.10.3",
    "psutil==7.2.2",
    "matplotlib==3.10.9",
    "numpy==2.4.4",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
    "ruff==0.15.12",
    "pyrefly>=0.64.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "A",     # flake8-builtins (no shadowing builtins)
    "C4",    # flake8-comprehensions
    "T20",   # flake8-print (no print() in library code)
    "PT",    # flake8-pytest-style
    "RUF",   # ruff-specific rules
    "ASYNC", # async best practices
]

[tool.pyrefly]
python-version = "3.13"
project-includes = ["bench"]
project-excludes = ["scripts", "results", "tests"]
search-path = ["."]
